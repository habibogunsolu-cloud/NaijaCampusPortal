<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle circular border -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3" />

  <!-- Center Content with Shadow -->
  <g filter="url(#shadow)">
    <!-- Graduation Cap / Mortarboard -->
    <path d="M 256 120 L 396 186 L 256 252 L 116 186 Z" fill="url(#goldGrad)" />
    <!-- Cap Underneath / Base -->
    <path d="M 160 215 L 160 270 C 160 300 200 322 256 322 C 312 322 352 300 352 270 L 352 215 L 256 260 Z" fill="#ffffff" fill-opacity="0.95" />
    <!-- Tassel -->
    <path d="M 370 198 L 388 280 C 388 290 380 298 375 298" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
    <circle cx="375" cy="298" r="6" fill="#f59e0b" />

    <!-- Open Book / Portal Pages -->
    <g transform="translate(136, 305)">
      <!-- Left Page -->
      <path d="M 120 40 C 70 30 20 38 0 45 L 0 115 C 20 108 70 100 120 110 Z" fill="#ffffff" />
      <!-- Right Page -->
      <path d="M 120 40 C 170 30 220 38 240 45 L 240 115 C 220 108 170 100 120 110 Z" fill="#ffffff" />
      <!-- Spine -->
      <line x1="120" y1="40" x2="120" y2="112" stroke="#047857" stroke-width="4" />
      <!-- Left Page Lines -->
      <line x1="24" y1="65" x2="100" y2="60" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
      <line x1="24" y1="82" x2="95" y2="78" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
      <!-- Right Page Lines -->
      <line x1="140" y1="60" x2="216" y2="65" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
      <line x1="145" y1="78" x2="216" y2="82" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Star / Merit Accent -->
    <polygon points="256,415 261,427 274,427 263,435 267,447 256,439 245,447 249,435 238,427 251,427" fill="url(#goldGrad)" />
  </g>
</svg>
